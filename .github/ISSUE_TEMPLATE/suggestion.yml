name: 文档建议
description: 修正说明、链接或使用边界；已有规则误判请提交反例
title: "[文档] "
labels: []
body:
  - type: markdown
    attributes:
      value: 如果已有输入和实际输出能说明规则不成立，请改用“提交一个反例”表单。
  - type: textarea
    id: problem
    attributes:
      label: 说明哪里需要修改
      description: 提供文件位置、当前表述和修改理由；不要粘贴敏感材料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议如何表达
      description: 可提供改写建议，无法确定时说明疑问即可。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 所附材料有权公开，且已经脱敏，没有补造事实或反馈。
          required: true
