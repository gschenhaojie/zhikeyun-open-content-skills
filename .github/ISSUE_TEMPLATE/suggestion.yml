name: 新建议
description: 建议改进说明、规则或新的公开 Skill
title: "[建议] "
labels: []
body:
  - type: markdown
    attributes:
      value: 请先说明真实问题和使用场景，不需要为了完整而设计复杂系统。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 谁在什么场景下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明建议的范围、预期输出和已知限制。
    validations:
      required: true
  - type: dropdown
    id: evidence_type
    attributes:
      label: 材料类型
      options:
        - 不附案例
        - 真实且已匿名
        - 获得授权的匿名材料
        - 明确标注的构造示例
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我不会提交客户隐私、编造数据或未经授权资料。
          required: true
