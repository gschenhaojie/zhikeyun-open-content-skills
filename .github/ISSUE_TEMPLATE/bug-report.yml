name: 规则问题报告
description: 报告规则误判、说明错误或文档问题
title: "[问题] "
labels: []
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿提交客户隐私、私人资料或未经授权内容。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及你预期的结果。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 使用场景
      description: 请提供已匿名化的必要上下文，不要粘贴敏感资料。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 判断依据
      description: 请说明你认为规则误判或文档错误的理由。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我已移除客户隐私、个人信息、密钥和未经授权资料。
          required: true
