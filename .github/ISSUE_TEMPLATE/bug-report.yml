name: 提交一个反例
description: 用匿名输入和实际输出说明一条规则何时不成立
title: "[反例] "
labels: []
body:
  - type: markdown
    attributes:
      value: 请只提交有权公开的脱敏材料。编辑过的材料请注明范围；没有实际运行时请直接说明。
  - type: input
    id: skill_version
    attributes:
      label: Skill 与版本
      description: 填写模块名称、版本和所用 AI；不要提供私人环境信息。
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 匿名输入与必要背景
      description: 保留能说明问题的最少材料，不提供可识别个人或机构的信息。
    validations:
      required: true
  - type: textarea
    id: actual_output
    attributes:
      label: 实际输出
      description: 粘贴相关片段；未运行就写明未运行，不补造结果。
    validations:
      required: true
  - type: textarea
    id: counterexample
    attributes:
      label: 哪个判断不成立，依据是什么
      description: 指出规则、原文位置、合理的不同判断及尚未确认的信息。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我有权公开这些材料，已移除身份信息、商业敏感信息、私人路径和密钥。
          required: true
